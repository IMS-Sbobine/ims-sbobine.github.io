<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Tracker</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%232457D6%22 stroke=%22white%22 stroke-width=%224%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F2;--ink:#1B1D1F;--ink2:#3C4043;--muted:#5F6368;--faint:#80868B;--note:#A3A8AD;--line:#D5D8DB;--line2:#E8EAED;--card:#FFFFFF;
  --blue:#2457D6;--hl:#EEF3FF;--green:#2BA84A;--green2:#6DD38B;--green-ink:#1E7B37;--yellow:#E8A600;--fyellow:#FBE7A1;--yline:#D9B940;
  --grey:#BDC1C6;--grey2:#DADCE0;--red:#D93025;--red-ink:#B3261E;--red-bg:#FDF1EF;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:var(--ink)}a:hover{color:var(--blue)}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:900px){.ph{display:none!important}}
@media (max-width:899px){.dk{display:none!important}}

/* ---------- header ---------- */
.hdr{max-width:1200px;margin:0 auto;padding:22px 40px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:baseline;gap:12px;font-family:'Archivo',sans-serif;text-decoration:none}
.wm{font-weight:900;font-stretch:68%;line-height:1;font-size:38px;color:var(--ink)}
.yr{font-weight:700;color:var(--blue);font-size:16px}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.navpill{display:flex;background:var(--ink);border-radius:24px;padding:4px}
.navpill a{text-decoration:none;font-size:15px;font-weight:600;color:#FFFFFF;padding:11px 18px;border-radius:20px}
.navpill a.on{color:var(--ink);background:var(--bg);font-weight:700}
.navpill a:not(.on):hover{color:#D5D8DB}
.apill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 12px;border-radius:11px;border:1px solid #C4C7CB;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
.apill a{color:inherit;text-decoration:none}.apill a:hover{text-decoration:underline}
.apill.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF;font-weight:700}
@media (max-width:899px){
  .hdr{padding:18px 20px 6px;align-items:flex-start}
  .brand{flex-direction:column;line-height:.9;padding-top:4px;gap:0}
  .wm{font-size:30px}.yr{font-size:14px;margin-top:4px}
  .navpill a{font-size:14px;padding:10px 14px;white-space:nowrap}
  /* phones: the menu gets its own full-width row, the account pill sits by the name */
  .hdr{flex-wrap:wrap;position:relative}
  .hdr-r{flex:1 1 100%;align-items:stretch}
  .navpill{justify-content:space-between}
  .navpill a{flex:1 1 auto;text-align:center;padding:10px 8px}
  .hdr-r .apill{position:absolute;top:22px;right:20px}
}
.banner-wrap{max-width:1200px;margin:14px auto 0;padding:0 40px}
@media (max-width:899px){.banner-wrap{padding:10px 20px 0;margin:0}}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:repeating-linear-gradient(135deg,#1B1D1F 0 14px,#2E3134 14px 28px);color:#FFFFFF;border-radius:16px;padding:12px 16px}
.banner .tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:#FFFFFF;color:var(--ink);font-size:14px;font-weight:900}
.banner .txt{flex:1 1 220px;font-size:14px;font-weight:600;line-height:1.4}
.banner a{color:#FFFFFF;font-size:14px;font-weight:800}

/* ---------- layout ---------- */
.view{transition:opacity .14s ease}
.view.out{opacity:0}
.wrap{max-width:1200px;margin:0 auto;padding:30px 40px 64px}
.cols{display:flex;gap:48px;align-items:flex-start}
.main{flex:1 1 0;min-width:0;max-width:700px}
.aside{width:360px;flex:0 0 360px;position:sticky;top:24px;background:var(--card);border-radius:22px;padding:22px}
@media (max-width:899px){.wrap{padding:14px 20px 24px}.cols{display:block}.main{max-width:none}}
h1.big{margin:4px 0 18px;line-height:1.08;font-weight:900;letter-spacing:-.02em;font-size:40px}
@media (max-width:899px){h1.big{font-size:28px}}
.lead{margin:0 0 8px;font-size:15px;line-height:1.45;color:var(--ink2)}
.muted{color:var(--muted)}
.loading{padding:80px 0;text-align:center;color:var(--muted);font-size:16px;font-weight:600}
.err-box{background:var(--red-bg);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.45;color:var(--red-ink);font-weight:600;margin:12px 0}

/* ---------- buttons, inputs ---------- */
.btn{height:56px;padding:0 24px;border:0;border-radius:28px;background:var(--ink);color:#FFFFFF;font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn:hover{color:#FFFFFF;background:#2E3134}
.btn:disabled{background:var(--grey);color:#FFFFFF}
.btn.red{background:var(--red)}.btn.red:hover{background:#C2271D}
.btn.wide{width:100%}
.btn2{height:48px;padding:0 20px;border-radius:24px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn2:hover{background:#FFFFFF;color:var(--ink)}
.btn2.wide{width:100%}
.sbtn{height:44px;padding:0 18px;border:0;border-radius:22px;background:var(--ink);color:#FFFFFF;font-size:15px;font-weight:800}
.sbtn2{height:44px;padding:0 18px;border-radius:22px;border:2px solid var(--ink);background:transparent;font-size:15px;font-weight:800}
.sbtn2.soft{border-color:var(--line)}
.sbtn:disabled,.sbtn2:disabled{opacity:.5}
.round{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:2px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center}
.round:disabled{opacity:.3}
.pillbtn{height:36px;padding:0 14px;border-radius:18px;border:2px solid var(--line);background:#FFFFFF;font-size:14px;font-weight:700}
.pillbtn.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.linkbtn{border:0;background:none;padding:0;font-size:inherit;font-weight:700;text-decoration:underline;color:inherit}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;min-width:0}
.fld .opt{font-weight:500;color:var(--muted)}
.inp{height:48px;border-radius:12px;border:2px solid var(--line);background:#FFFFFF;padding:0 14px;font-size:16px;font-weight:600;color:var(--ink);min-width:0;width:100%}
select.inp{padding-right:8px}
.ta{border-radius:12px;border:2px solid var(--line);padding:12px 14px;font-size:16px;font-weight:600;line-height:1.35;resize:vertical;color:var(--ink);width:100%;background:#FFFFFF}
.inp:focus,.ta:focus{border-color:var(--ink);outline:none}
.inp:focus-visible,.ta:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bad{border-color:var(--red)!important}
.ferr{font-size:13px;font-weight:700;color:var(--red-ink)}
.chip{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 4px 0 14px;border-radius:20px;background:var(--ink);color:#FFFFFF;font-size:15px;font-weight:700}
.chipx{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:#FFFFFF;font-size:18px;line-height:1}
.chipx:hover{background:#3C4043}
.add{align-self:flex-start;height:44px;padding:0 16px;border-radius:22px;border:2px dashed #9AA0A6;background:transparent;color:var(--ink);font-size:15px;font-weight:700}
.add:hover{border-color:var(--ink)}
.addin{height:44px;border-radius:22px;border:2px solid var(--ink);padding:0 16px;font-size:15px;font-weight:700;width:260px;max-width:100%}
.card{background:#FFFFFF;border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.card h2{margin:0;font-size:17px;font-weight:900}
.sw{width:56px;height:34px;flex:0 0 56px;border:0;border-radius:17px;padding:4px;display:flex;justify-content:flex-start;background:var(--grey)}
.sw[aria-checked="true"]{background:var(--ink)}
.knob{width:26px;height:26px;border-radius:50%;background:#FFFFFF;display:block}
.sw[aria-checked="true"] .knob{transform:translateX(22px)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.swrow span{font-size:15px;font-weight:700;line-height:1.3}
.opt2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.optb{height:48px;border-radius:12px;font-size:15px;font-weight:700;border:2px solid var(--line);background:#FFFFFF;color:var(--ink)}
.optb[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:#FFFFFF}

/* badges, pills */
.badge{font-size:12px;font-weight:900;height:22px;min-width:30px;padding:0 6px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;flex:0 0 auto}
.spill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;font-size:14px;font-weight:800;white-space:nowrap}
.mini{width:18px;height:18px;flex:0 0 18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;line-height:1}
.st-submitted,.st-reused,.st-reused-asis{background:var(--green);color:#FFFFFF}
.st-writing{background:var(--yellow);color:var(--ink)}
.st-assigned{background:var(--fyellow);color:var(--ink)}
.st-open{background:var(--grey2);color:var(--ink)}
.st-overdue{background:var(--red);color:#FFFFFF}
.st-removed{background:#F1F3F4;color:var(--muted);text-decoration:line-through}
.mini.st-assigned{border:2px solid var(--yline)}
.mini.st-open{background:var(--grey)}

/* steps */
.hsteps{list-style:none;margin:0 0 18px;padding:0;position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.hsteps .track,.hsteps .fill{position:absolute;left:12.5%;top:10px;height:4px;border-radius:2px}
.hsteps .track{right:12.5%;background:var(--line)}
.hsteps .fill{background:var(--ink);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hsteps li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.sdot{width:24px;height:24px;flex:0 0 24px;border-radius:50%;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#FFFFFF;background:#FFFFFF;border:3px solid var(--grey)}
.sdot.done{background:var(--ink);border:0}
.sdot.cur{border:6px solid var(--ink)}
.slab{font-size:12px;font-weight:600;color:var(--muted)}
.slab.cur{font-weight:800;color:var(--ink)}
.vsteps{list-style:none;margin:0 0 18px;padding:0}
.vsteps li{position:relative;display:flex;align-items:center;gap:12px;min-height:40px}
.vsteps .vl{position:absolute;left:10px;top:28px;height:24px;width:4px;border-radius:2px;background:var(--line);overflow:hidden}
.vsteps .vl i{position:absolute;left:0;top:0;width:100%;height:0;background:var(--ink);transition:height .45s cubic-bezier(.2,.8,.2,1)}
.vsteps .vl.done i{height:100%}
.vsteps .slab{font-size:15px}
.summary{border-top:1px solid var(--line2);padding-top:16px;display:flex;align-items:flex-start;gap:10px}
.summary .t{font-size:18px;font-weight:900}
.summary .s{font-size:14px;color:var(--muted);margin-top:2px}
.summary .x{font-size:14px;margin-top:8px;line-height:1.4}
.darksum{background:var(--ink);color:#FFFFFF;border-radius:16px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.darksum .t{font-size:18px;font-weight:900}.darksum .s{font-size:14px;color:#D5D8DB;margin-top:2px}
.darksum a,.darksum button.linkbtn{color:#FFFFFF;font-size:14px;font-weight:700;padding:4px 0}
.darksum .badge{box-shadow:0 0 0 2px #FFFFFF;margin-top:2px}
.bottombar{position:sticky;bottom:0;padding:14px 20px 22px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;z-index:5}
.bottombar .btn{flex:1 1 auto;min-height:56px;height:auto;padding:8px 18px}
.bottombar .btn2{height:56px;padding:0 20px;font-size:16px}
.note-warn{margin-top:10px;font-size:13px;line-height:1.4;font-weight:700;color:var(--red-ink)}

/* ---------- pick (step 1) ---------- */
.searchbox{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;background:#FFFFFF;border:2px solid var(--line);margin-bottom:16px}
.searchbox:focus-within{border-color:var(--ink)}
.searchbox input{border:0;outline:none;background:transparent;font-size:15px;flex:1 1 auto;min-width:0}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}
.weeknav .mid{text-align:center;line-height:1.2}
.weeknav .mid b{display:block;font-weight:800;font-size:17px}
.weeknav .mid span{font-size:13px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:22px}
.dtab{height:72px;border-radius:14px;border:2px solid var(--line);background:#FFFFFF;color:var(--ink);padding:6px 0}
.dtab[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:#FFFFFF}
.dtab .wd{display:block;font-size:12px;font-weight:600;opacity:.75}
.dtab .dn{display:block;font-size:20px;font-weight:900;line-height:1.1}
.dtab .dd{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0}
.dtab .dc{display:block;font-size:11px;font-weight:600;opacity:.75}
@media (max-width:899px){.dtab{height:64px}}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.dayhead h2{margin:0;font-size:15px;font-weight:800}
.dayhead span{font-size:13px;color:var(--muted)}
.daynote{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:#E8EAED;color:var(--ink2);font-size:11px;font-weight:800;margin-left:8px;vertical-align:1px;white-space:nowrap;letter-spacing:.01em}
table.lt .daynote{margin-left:0;font-size:10px;padding:0 6px;height:20px}
.metro{list-style:none;margin:0;padding:0}
.stoprow{display:flex;align-items:stretch}
.rail{position:relative;width:40px;flex:0 0 40px}
.rail .bar{position:absolute;left:16px;width:8px;top:0;bottom:0}
.rail .stop{position:absolute;left:7px;top:20px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1;font-size:15px;font-weight:900;line-height:1;color:#FFFFFF;border:3px solid #FFFFFF}
.lcard{flex:1 1 auto;min-width:0;text-align:left;margin:6px 0;padding:12px 14px 14px;border-radius:16px;border:2px solid transparent;background:#FFFFFF;color:var(--ink);box-shadow:0 1px 0 var(--line);display:block}
.lcard .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lcard .tm{font-size:13px;font-weight:700;color:var(--muted)}
.lcard .tt{display:block;font-size:19px;font-weight:900;letter-spacing:-.01em;margin-top:2px}
.lcard .pf{display:block;font-size:14px;font-weight:600;margin-top:1px}
.lcard .tp{display:block;font-size:14px;line-height:1.35;margin-top:4px;color:var(--ink2)}
.lcard .sr2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-top:10px;padding-top:9px;border-top:1px solid var(--line2)}
.lcard .sr2.overdue{color:var(--red-ink)}
.lcard.sel{border-color:var(--ink);background:var(--ink);color:#FFFFFF;box-shadow:none}
.lcard.sel .tm{color:#B9BDC1}.lcard.sel .tp{color:#D5D8DB}
.lcard.sel .sr2{border-top-color:#3C4043;color:#FFFFFF}
.lcard.sel .badge{box-shadow:0 0 0 2px #FFFFFF}
.lcard.sel .mini{border:2px solid #FFFFFF}
.lcard.removed .tt{text-decoration:line-through}
.joinbtn{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:2px dashed #9AA0A6;background:transparent;color:var(--ink);min-height:56px;text-align:left}
.joinbtn[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:#FFFFFF}
.joinbtn .bx{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;background:#FFFFFF;color:var(--ink);border:2px solid var(--ink)}
.joinbtn[aria-pressed="true"] .bx{background:var(--ink);color:#FFFFFF}
.joinbtn b{display:block;font-size:14px;font-weight:800}
.joinbtn small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:1px}
.empty{background:#FFFFFF;border-radius:16px;padding:18px;color:var(--muted);font-size:15px;margin-left:40px}
.reshead{margin:18px 0 4px 40px;font-size:14px;font-weight:800;color:var(--ink2)}
.customlink{margin:18px 0 0 40px;font-size:14px;color:var(--muted)}

/* ---------- type, upload ---------- */
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:899px){.choices{display:flex;flex-direction:column;gap:12px}}
.choice{width:100%;display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:18px;border:2px solid var(--line);background:#FFFFFF;color:var(--ink);min-height:96px;text-align:left}
.choice[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.choice:disabled{opacity:.55;border-style:dashed}
.choice .ic{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.choice[aria-checked="true"] .ic{background:var(--ink);color:#FFFFFF}
.choice .tx{flex:1 1 auto}
.choice .tx b{display:block;font-size:19px;font-weight:900}
.choice .tx span{display:block;font-size:14px;line-height:1.35;color:var(--muted);margin-top:2px}
.radio{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:#FFFFFF;border:2px solid var(--grey)}
[aria-checked="true"]>.radio{border:7px solid var(--ink)}
.dgrid{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:899px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.files2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:899px){.files2{display:flex;flex-direction:column}}
.slot{display:flex;flex-direction:column;gap:8px}
.slot>span{font-size:14px;font-weight:700}
.drop{position:relative}
.fz{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:2px dashed #9AA0A6;border-radius:16px;padding:14px;color:var(--ink);min-height:76px;width:100%}
.fz:hover,.fz.over{border-color:var(--ink);background:#FFFFFF}
.fz .ico{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:#FFFFFF;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.fz b{display:block;font-size:15px;font-weight:700}
.fz small{display:block;font-size:13px;line-height:1.35;color:var(--muted)}
.ff{display:flex;align-items:center;gap:12px;background:#FFFFFF;border:2px solid var(--ink);border-radius:16px;padding:12px 8px 12px 14px;min-height:76px}
.ff .ico{width:40px;height:40px;flex:0 0 40px;border-radius:10px;color:#FFFFFF;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ff .nm{flex:1 1 auto;min-width:0}
.ff .nm b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ff .nm small{display:block;font-size:13px;color:var(--muted)}
.ff .rm{width:44px;height:44px;border:0;border-radius:50%;background:transparent;font-size:22px;color:var(--muted)}
.ff .rm:hover{background:var(--bg)}
.savedas{margin-top:18px;background:#FFFFFF;border-radius:16px;padding:14px 16px}
.savedas .k{display:block;font-size:13px;font-weight:700;color:var(--muted)}

.wbtn{height:48px;padding:0 22px;border:0;border-radius:24px;background:#FFFFFF;color:var(--ink);font-size:16px;font-weight:800;display:inline-flex;align-items:center;text-decoration:none}
.wbtn2{height:48px;padding:0 20px;border-radius:24px;border:2px solid #FFFFFF;background:transparent;color:#FFFFFF;font-size:15px;font-weight:800}
.wbtn2.danger{border-color:#FFB4AB;color:#FFB4AB}
.graybox{margin-top:16px;background:var(--bg);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5}
.keyshow{margin-top:12px;background:var(--bg);border-radius:12px;padding:12px 14px;font-family:'Courier New',monospace;font-size:18px;font-weight:700;letter-spacing:2px;word-break:break-all}
.alinks{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px;font-weight:700}
.adminli{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line2)}
.adminli small{display:block;font-size:14px;color:var(--muted);font-weight:500}

/* ---------- access: gate, sign in, volunteering, reports, members ---------- */
.gsi{min-height:44px;display:flex;align-items:center;justify-content:center}
.or{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:13px;font-weight:700}
.or::before,.or::after{content:'';flex:1 1 auto;height:1px;background:var(--line)}
.apill .nm{max-width:140px;overflow:hidden;text-overflow:ellipsis}
.volbtn{height:32px;padding:0 12px;border-radius:16px;border:2px solid var(--ink);background:#FFFFFF;color:var(--ink);font-size:13px;font-weight:800}
.volbtn:hover{background:var(--ink);color:#FFFFFF}
.volbtn.out{border-color:var(--line);color:var(--muted)}
.volbtn.out:hover{background:#FFFFFF;border-color:var(--red);color:var(--red-ink)}
.vtag{font-size:11px;font-weight:600;color:var(--faint)}
.chip.vol{background:#5F6368}
.chipc{height:22px;padding:0 8px;margin-left:6px;border:0;border-radius:11px;background:#FFFFFF;color:var(--ink);font-size:11px;font-weight:800}
.repbtn{display:block;margin-top:8px;border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--faint);text-decoration:underline}
.repbtn:hover{color:var(--red-ink)}
dialog.dlg{border:2px solid var(--ink);border-radius:22px;padding:22px;max-width:460px;width:calc(100% - 32px);box-shadow:6px 6px 0 var(--ink);color:var(--ink)}
dialog.dlg::backdrop{background:rgba(27,29,31,.45)}
.notify{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:#FFFFFF;border-radius:18px;padding:18px 20px}
.notify h2{margin:0;font-size:18px;font-weight:900}
.notify p{margin:4px 0 0;font-size:14px;line-height:1.45;color:var(--ink2);max-width:640px}
@media (max-width:899px){.notify{margin-top:22px}.notify .btn2{width:100%}}
.viewas{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.viewas select{height:32px;border-radius:16px;border:0;padding:0 10px;font-size:14px;font-weight:700;color:var(--ink);background:#FFFFFF}
.mrow{display:grid;grid-template-columns:minmax(0,1.3fr) 160px minmax(0,1fr) 190px;gap:12px;align-items:center;border-top:1px solid var(--line2);padding:12px 0;font-size:14px}
.mrow .meta{margin-top:0}
.mact{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px}
@media (max-width:899px){.mrow{display:flex;flex-direction:column;align-items:flex-start;gap:4px}}

.mine{margin-top:30px;background:#FFFFFF;border:2px solid var(--ink);border-radius:22px;padding:20px 22px;box-shadow:6px 6px 0 var(--ink);scroll-margin-top:20px}
.mine h2{margin:0 0 4px;font-size:22px;font-weight:900;letter-spacing:-.01em}
.mine .sub{margin:0 0 12px;font-size:14px;line-height:1.45;color:var(--ink2)}
.hreq{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:15px;line-height:1.4}
.hreq.in{background:var(--hl);box-shadow:inset 0 0 0 2px var(--blue)}
.hreq.out{background:var(--bg)}
.hreq small{display:block;font-size:13px;color:var(--muted)}
.hreq .acts{display:flex;gap:8px;flex:0 0 auto}
.mrow2{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid var(--line2);padding:12px 0;font-size:15px}
.mrow2 b{font-weight:800}
.mrow2 .when{color:var(--muted);font-size:14px}
.mrow2 .grow{flex:1 1 auto}
.hbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#FFFFFF!important;font-size:11px;font-weight:900;text-decoration:none!important}
@media (max-width:899px){.mine{margin-top:22px;padding:16px;border-radius:20px;box-shadow:5px 5px 0 var(--ink)}.hreq .acts{width:100%}.hreq .acts .sbtn,.hreq .acts .sbtn2{flex:1 1 0}}
/* cancelled lectures */
.st-cancelled{background:#F1F3F4;color:var(--faint);text-decoration:line-through;box-shadow:inset 0 0 0 1.5px var(--line)}
.mini.st-cancelled{text-decoration:none}
table.lt tr.row.cx td{background:repeating-linear-gradient(135deg,#FAFAF9 0 10px,#F3F4F2 10px 20px)}
.cx .lname b,.cx .r2 b,.cx .ltopic .t,.cx .tp.ct{text-decoration:line-through;color:var(--faint)}
.cnote{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;line-height:1.35;color:var(--ink2);background:#FFFFFF;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px}
table.lt .cnote{margin-left:44px}
.dcard.cx{background:repeating-linear-gradient(135deg,#FAFAF9 0 10px,#F3F4F2 10px 20px)}
.lcard.cx{opacity:.6;cursor:not-allowed}
.lcard.cx .tt{text-decoration:line-through}
.cxbtn{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--faint)}
.cxbtn:hover,.cxbtn button:hover{color:var(--red-ink)}
.cx .cxbtn{color:var(--ink2)}
/* lecture pop-up on the semester board */
.lpop.hov{pointer-events:none}
.lpop{position:absolute;z-index:30;width:310px;max-width:calc(100vw - 32px);background:#FFFFFF;border:2px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:14px 16px;font-size:14px;line-height:1.45}
.lpop .t{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900}
.lpop .m{color:var(--muted);margin-top:2px}
.lpop .tp{margin-top:8px;color:var(--ink2)}
.lpop .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px}
.lpop .row a{font-weight:800;font-size:13px}
.lpop .hint{margin-top:10px;font-size:12px;color:var(--faint)}
/* class links strip */
.strip{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;border-radius:18px;background:#FFFFFF}
.strip .lab{font-size:13px;font-weight:800;color:var(--muted);padding:0 6px 0 4px}
.chipl{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:18px;border:2px solid var(--line);background:#FFFFFF;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink)}
.chipl:hover{border-color:var(--ink);color:var(--ink)}
.chipl .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.chipl.dark{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.chipl.dark:hover{color:#FFFFFF}
.strip .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.strip .note{flex:1 1 100%;margin:2px 4px 0;font-size:12px;color:var(--muted)}
@media (max-width:899px){.strip .sep{display:none}.strip{margin-top:22px}}
/* admin tabs */
.atabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 28px}
.atabs button{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:21px;border:2px solid var(--line);background:#FFFFFF;font-size:15px;font-weight:700;color:var(--ink)}
.atabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.atabs .cnt{min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#FFFFFF;font-size:13px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
@media (max-width:899px){.atabs{flex-wrap:nowrap;overflow-x:auto;margin:18px -20px 24px;padding:0 20px}.atabs button{flex:0 0 auto}}
.astack{display:flex;flex-direction:column;gap:28px}
.astack > :empty{display:none}
.astack .h2{margin-bottom:12px}
.clear{display:flex;align-items:center;gap:14px;background:#FFFFFF;border-radius:22px;padding:22px}
.clear .tk{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--green);color:#FFFFFF;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}
/* study diary */
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-top:26px}
.prog .num{font-family:'Archivo',sans-serif;font-weight:900;font-size:28px;font-stretch:80%;font-variant-numeric:tabular-nums}
.prog .plab{font-size:14px;font-weight:700;color:var(--muted)}
.prog .bar{flex:1 1 260px;height:14px;border-radius:7px;background:var(--line2);overflow:hidden;display:flex}
.prog .bar i{display:block;height:100%;transition:width .4s ease}
.prog .lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.prog .lg span{display:inline-flex;gap:6px;align-items:center}
.prog .lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mchips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
.mchips button{height:38px;padding:0 15px;border-radius:19px;border:2px solid var(--line);background:#FFFFFF;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.mchips button .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.mchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.dlist{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.dweek{margin:22px 0 0;font-size:22px;font-weight:900;letter-spacing:-.01em}
#diary .tools h2{min-width:0}
@media (max-width:899px){#diary .tools h2{font-size:18px}#diary .tools .l{flex-wrap:wrap;gap:8px}}
.dweek span{margin-left:10px;font-size:14px;font-weight:600;color:var(--muted)}
.dday{font-size:14px;font-weight:900;margin:10px 0 -2px}
.dl{background:#FFFFFF;border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;scroll-margin-top:20px}
.dl.cx{background:repeating-linear-gradient(135deg,#FAFAF9 0 10px,#F3F4F2 10px 20px)}
.dl.cx .tt,.dl .ct{text-decoration:line-through;color:var(--faint)}
.tick{grid-row:1 / span 3;width:46px;height:46px;border-radius:14px;border:2.5px solid var(--ink);background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--ink)}
.tick[data-s="1"]{background:linear-gradient(90deg,#E8A600 50%,#FFFFFF 50%)}
.tick[data-s="2"]{background:#2BA84A;border-color:#2BA84A;color:#FFFFFF}
.tick:disabled{opacity:.35;cursor:not-allowed}
.dl .r1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.dl .tt{font-size:17px;font-weight:900}
.dl .meta{font-size:13px;color:var(--muted)}
.dl .tp{font-size:14px;color:var(--ink2);line-height:1.4}
.aim{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;border:0;background:#ECEDEB;color:var(--ink2);font-size:12px;font-weight:800}
.aim.late{background:var(--red-bg);color:var(--red-ink)}
.aimset{font-size:13px;font-weight:700;color:var(--muted)}
.res{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.rchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 4px 0 10px;border-radius:15px;background:var(--bg);font-size:13px;font-weight:700;max-width:100%}
.rchip a{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip a:hover{text-decoration:underline}
.rchip .k{font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.rchip .pv{font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:#FFFFFF;color:var(--muted);white-space:nowrap}
.rchip .more{border:0;background:none;width:26px;height:26px;border-radius:50%;font-size:16px;line-height:1;font-weight:900;color:var(--muted)}
.rchip .more:hover{background:#FFFFFF;color:var(--ink)}
.addr{border:2px dashed #9AA0A6;background:transparent;height:30px;border-radius:15px;padding:0 11px;font-size:13px;font-weight:700;color:var(--ink)}
.addr:hover{border-color:var(--ink)}
.modres{background:#FFFFFF;border:2px solid var(--ink);border-radius:18px;padding:16px;margin-top:16px}
.modres h3{margin:0;font-size:18px;font-weight:900}
.modres .sub{font-size:14px;line-height:1.45;color:var(--ink2)}
.modres .res{grid-column:auto}
.menu{position:absolute;z-index:50;min-width:220px;max-width:290px;background:#FFFFFF;border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:6px;display:flex;flex-direction:column}
.menu [role="menuitem"]{border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none}
.menu [role="menuitem"]:hover,.menu [role="menuitem"]:focus-visible{background:var(--bg)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.dmain{min-width:0}
.dside{display:flex;flex-direction:column;gap:14px;margin-top:26px;position:sticky;top:16px}
@media (max-width:1023px){.dgrid{grid-template-columns:minmax(0,1fr)}.dside{position:static}}
.grp h3{margin:0;font-size:18px;font-weight:900}
.grp h4{margin:16px 0 6px;font-size:14px;font-weight:900}
.grp .meta{font-size:13px;color:var(--muted)}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
.av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#FFFFFF}
.mem .grow{flex:1 1 auto;min-width:0}
.mem b{font-weight:800}
.otag{font-size:11px;font-weight:700;color:var(--faint)}
.mbar2{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:4px}
.mbar2 i{display:block;height:100%;background:#2BA84A}
.cnum{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.lock{font-size:12px;color:var(--muted);font-weight:700}
.xs{border:0;background:none;width:26px;height:26px;border-radius:50%;font-size:16px;font-weight:900;color:var(--faint)}
.xs:hover{background:var(--bg);color:var(--red-ink)}
.ginv{display:flex;gap:8px;margin-top:12px}
.ginv .inp{height:38px;font-size:14px}
.ginv .sbtn{height:38px;flex:0 0 auto}
.aim.grp{background:#F1ECFB;color:#5B2DB0}
.rchip.hid{opacity:.55}
.rchip .pv.sh{background:#F1ECFB;color:#5B2DB0}
.ropts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ropt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:#FFFFFF;color:var(--ink)}
.ropt:hover,.ropt:focus-visible{border-color:var(--ink)}
.ropt b{font-size:15px;font-weight:800}
.ropt span{font-size:13px;color:var(--muted)}
.li2{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid var(--line2);padding:12px 0;font-size:15px}
.li2 .grow{flex:1 1 240px;min-width:0}
.li2 b{font-weight:800}
.li2 small{display:block;font-size:13px;color:var(--muted)}
@media (max-width:899px){.dl{padding:12px}.tick{width:42px;height:42px}}
.bwarn{margin-top:8px;background:var(--red-bg);color:var(--red-ink);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;line-height:1.4}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#FFFFFF;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;max-width:min(560px,calc(100% - 32px));box-shadow:0 8px 24px rgba(27,29,31,.25);opacity:0;pointer-events:none;z-index:50;transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--red)}

/* ---------- motion (only when people haven't asked for less) ---------- */
@media (prefers-reduced-motion: no-preference){
  button,a,input,select,textarea{transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .18s cubic-bezier(.2,.8,.2,1)}
  button:active:not(:disabled){transform:scale(.97)}
  .knob{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
  .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .drop{animation:drop .32s cubic-bezier(.2,.8,.2,1) both}
  .pop{animation:pop .42s cubic-bezier(.2,.9,.25,1.2) both}
  .cb:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(27,29,31,.18)}
  .cb.on:hover{box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px var(--blue),0 4px 10px rgba(27,29,31,.18)}
  .lcard,.dtab,.choice,.what,.joinbtn,.optb,.partb{transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,transform .18s cubic-bezier(.2,.8,.2,1)}
  .lcard .tm,.lcard .tp,.lcard .sr2,.lcard .badge,.lcard .mini{transition:color .25s ease,border-color .25s ease,box-shadow .25s ease}
  table.lt tr.row.flash{animation:flashrow 1.4s ease-out 2}
  .dcard.flash{animation:flashcard 1.4s ease-out 2}
  .done .line-in{transform-origin:top;animation:drawline .55s cubic-bezier(.5,0,.2,1) both}
  .done .line-out{transform-origin:top;animation:drawline .7s cubic-bezier(.2,.8,.2,1) 1.25s both}
  .done .train{animation:train .5s cubic-bezier(.6,0,.4,1) .35s both}
  .done .stopbig{animation:arrive .7s cubic-bezier(.2,.9,.2,1.25) .8s both}
  .done .tick{stroke-dasharray:40;stroke-dashoffset:40;animation:tick .45s ease-out 1.25s forwards}
  .done .ring{animation:ring 1.2s cubic-bezier(.1,.6,.3,1) both}
  .done .bit{animation:burst 1.9s cubic-bezier(.15,.7,.3,1) both}
  .done .up{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  .done .tk{animation:pop .4s cubic-bezier(.2,.9,.25,1.4) both}
  .done .glow{animation:rise .55s cubic-bezier(.2,.8,.2,1) both,glow 1.6s ease-in-out 2.4s 2}
}
@media (prefers-reduced-motion: reduce){
  .view{transition:none}
  .done .bit,.done .ring,.done .train{display:none}
  .meter .track i,.hsteps .fill,.vsteps .vl i{transition:none}
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes flashrow{0%{box-shadow:inset 0 0 0 2px #2457D6,0 0 0 0 rgba(36,87,214,.45)}70%{box-shadow:inset 0 0 0 2px #2457D6,0 0 0 12px rgba(36,87,214,0)}100%{box-shadow:inset 0 0 0 2px #2457D6,0 0 0 0 rgba(36,87,214,0)}}
@keyframes flashcard{0%{box-shadow:0 0 0 2px #2457D6,0 0 0 2px rgba(36,87,214,.45)}70%{box-shadow:0 0 0 2px #2457D6,0 0 0 14px rgba(36,87,214,0)}100%{box-shadow:0 0 0 2px #2457D6,0 0 0 2px rgba(36,87,214,0)}}
@keyframes drawline{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes train{0%{transform:translateY(-70px);opacity:0}20%{opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes arrive{0%{transform:scale(0)}55%{transform:scale(1.22)}75%{transform:scale(.92)}100%{transform:scale(1)}}

<script>
// Schedule parser — turns pdf.js text items into lecture rows.
// Pure function; the same code is embedded in the web app's admin page.
// pages: [{ items: [{ str, x, y, w }] }]  (y measured from the TOP of the page)
function parseSchedule(pages) {
  var MONTHS = { january:1, february:2, march:3, april:4, may:5, june:6, july:7,
    august:8, september:9, october:10, november:11, december:12,
    gennaio:1, febbraio:2, marzo:3, aprile:4, maggio:5, giugno:6, luglio:7,
    agosto:8, settembre:9, ottobre:10, novembre:11, dicembre:12 };
  var TIME_RE = /^(\d{1,2})[.:](\d{2})\s*[-‐-―]\s*(\d{1,2})[.:](\d{2})\s*(.*)$/;
  var DATE_RE = /(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/;
  var COLS = { prof: 115, course: 178, module: 260, topic: 322, room: 452 };
  var clean = function (s) { return String(s || '').replace(/[‐-―]/g, '-').replace(/\s+/g, ' ').trim(); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  var lectures = [], warnings = [], dayNotes = {};

  pages.forEach(function (page, pi) {
    var items = page.items.filter(function (it) { return clean(it.str); })
      .map(function (it) { return { str: clean(it.str), x: it.x, y: it.y, w: it.w || 0 }; });

    // Calibrate columns from the header row if present (layout may drift slightly)
    var hdr = {};
    items.forEach(function (it) { if (it.y < 90) hdr[it.str.toUpperCase()] = it.x; });
    var shift = hdr.DATE !== undefined ? hdr.DATE - 69 : 0;
    var col = {}; Object.keys(COLS).forEach(function (k) { col[k] = COLS[k] + shift; });

    // 1) time rows
    var rows = [];
    items.forEach(function (it) {
      if (it.x > col.prof + 10) return;
      var m = it.str.match(TIME_RE);
      if (!m) return;
      rows.push({ y: it.y, start: pad(+m[1]) + ':' + m[2], end: pad(+m[3]) + ':' + m[4],
        startMin: +m[1] * 60 + +m[2], profInline: clean(m[5]), cells: { prof: [], course: [], module: [], topic: [], room: [] } });
    });
    rows.sort(function (a, b) { return a.y - b.y; });

    // 2) date labels (column left of time column); merge 2-line labels
    var dl = items.filter(function (it) { return it.x < col.prof - 25 && !TIME_RE.test(it.str) && it.y > 85; })
      .sort(function (a, b) { return a.y - b.y; });
    var labels = [];
    dl.forEach(function (it) {
      var last = labels[labels.length - 1];
      if (last && !DATE_RE.test(last.text) && it.y - last.y2 <= 9) { last.text += ' ' + it.str; last.y2 = it.y; }
      else labels.push({ text: it.str, y1: it.y, y2: it.y });
    });
    var dates = [];
    labels.forEach(function (l) {
      var m = l.text.match(DATE_RE);
      if (!m || !MONTHS[m[2].toLowerCase()]) return;
      dates.push({ iso: m[3] + '-' + pad(MONTHS[m[2].toLowerCase()]) + '-' + pad(+m[1]), y: (l.y1 + l.y2) / 2 - 3.5, used: false });
    });

    // 3) group rows into days (start time goes back down => new day)
    var days = [], cur = null;
    rows.forEach(function (r) {
      if (!cur || r.startMin <= cur.rows[cur.rows.length - 1].startMin || r.y - cur.rows[cur.rows.length - 1].y > 30) {
        cur = { rows: [] }; days.push(cur);
      }
      cur.rows.push(r);
    });
    days.forEach(function (d) {
      var c = (d.rows[0].y + d.rows[d.rows.length - 1].y) / 2, best = null, bd = 1e9;
      dates.forEach(function (dt) { var dist = Math.abs(dt.y - c); if (dist < bd) { bd = dist; best = dt; } });
      if (!best || bd > 30) { warnings.push('Page ' + (pi + 1) + ': could not match a date to slots near y=' + Math.round(c)); return; }
      if (best.used) warnings.push('Page ' + (pi + 1) + ': date ' + best.iso + ' matched twice');
      best.used = true; d.date = best.iso; d.yTop = d.rows[0].y - 12; d.yBot = d.rows[d.rows.length - 1].y + 4;
    });

    // 4) distribute cell text to rows
    items.forEach(function (it) {
      if (it.x < col.prof - 25 || it.y < 85) return;            // date column / header
      if (it.x <= col.prof + 10 && TIME_RE.test(it.str)) return; // time cell

        if (d) dayNotes[d.date] = it.str;

      var row = null, bd = 1e9;
      rows.forEach(function (r) { var dist = Math.abs(r.y - 3 - it.y); if (dist < bd) { bd = dist; row = r; } });
      if (!row || bd > 9.5) return;

    days.forEach(function (d) {
      if (!d.date) return;
      d.rows.forEach(function (r) {
        var j = function (k) { return clean(r.cells[k].sort(function (a, b) { return a.y - b.y || a.x - b.x; }).map(function (i) { return i.str; }).join(' ')); };

        if (!prof) return; // empty slot
        var room = j('room'), topic = j('topic'), module = j('module');

        var mm = module.match(/^([A-Z0-9 \-\/&']+?)\s+([a-z].*)$/);
        if (mm) { module = mm[1]; topic = clean(mm[2] + ' ' + topic); }

          professor: prof, course: j('course'), module: module, topic: topic, room: room });
      });
    });
  });

  lectures.sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
  // lecture number = order within module
  var cnt = {};
  lectures.forEach(function (l) { cnt[l.module] = (cnt[l.module] || 0) + 1; l.number = cnt[l.module]; });
  return { lectures: lectures, dayNotes: dayNotes, warnings: warnings };
}
if (typeof module !== 'undefined') module.exports = parseSchedule;
</script>

function isoMs(iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function msIso(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function mondayMs(iso) { var ms = isoMs(iso), wd = (new Date(ms).getUTCDay() + 6) % 7; return ms - wd * DAY; }
function weekOf(iso) { return Math.round((mondayMs(iso) - SEM.start) / (7 * DAY)); }
function weekdayOf(iso) { return (new Date(isoMs(iso)).getUTCDay() + 6) % 7; }
function weekDays(k) { var out = []; for (var i = 0; i < 5; i++) out.push(msIso(SEM.start + k * 7 * DAY + i * DAY)); return out; }
function curWeek() { return Math.max(0, Math.min(SEM.weeks - 1, weekOf(S.data.today))); }
var MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var WDL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
function rangeLabel(k, longMonths) {
  var d = weekDays(k), a = new Date(isoMs(d[0])), b = new Date(isoMs(d[4]));
  var M = longMonths ? MONL : MON_;
  return a.getUTCDate() + (a.getUTCMonth() === b.getUTCMonth() ? '' : ' ' + M[a.getUTCMonth()]) + ' – ' + b.getUTCDate() + ' ' + M[b.getUTCMonth()];
}
function setData(d) {
  S.data = d;
  byId = {};
  d.lectures.forEach(function (l) { byId[l.id] = l; });
  var dates = d.lectures.map(function (l) { return l.date; }).sort();
  var first = dates[0] || d.today, last = dates[dates.length - 1] || d.today;
  SEM.start = mondayMs(first);
  SEM.weeks = Math.max(1, Math.round((mondayMs(last) - SEM.start) / (7 * DAY)) + 1);
  $('#names-dl').innerHTML = (d.names || []).map(function (n) { return '<option value="' + h(n) + '">'; }).join('');
  if (d.me) {
    S.me = d.me;
    S.admin = d.me.admin ? { name: d.me.name } : null;
    // a sign-in that expired or was signed out elsewhere
    if (S.tok && !d.me.email && !d.me.viewAs) dropSession();
  }
  S.locked = false;
  S.env = d.env || S.env;
  S.universal = d.universal || { on: false };
}
function lecturesOn(iso) { return S.data.lectures.filter(function (l) { return l.date === iso; }); }
function lecTitle(l) { return lectureTitle_(l.module, l.n); }
function statusLabel(l) { return l.removed ? 'Removed from schedule' : ST[l.st].label; }
function srcNote(l) {

  if (l.src === 'schedule') return 'Details obtained from the schedule';

function updateLecture(dto, counts, names) {
  if (!dto) return;
  var i = S.data.lectures.findIndex(function (l) { return l.id === dto.id; });
  if (i >= 0) S.data.lectures[i] = dto; else S.data.lectures.push(dto);
  byId[dto.id] = dto;
  if (counts) S.data.counts = counts;
  if (names) { S.data.names = names; $('#names-dl').innerHTML = names.map(function (n) { return '<option value="' + h(n) + '">'; }).join(''); }
}
function stampIn(s) { return stampLabel(s).replace(/^Today/, 'today').replace(/^Yesterday/, 'yesterday'); }
function stampLabel(s) {
  if (!s) return '';

  if (today && msIso(isoMs(today) - DAY) === d) return 'Yesterday ' + t;

}

  var g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); var to = g.getAttribute('data-go'); if (to !== S.page || to === 'upload') { if (to === 'upload' && S.page === 'upload' && U.step === 'done') resetUpload(); go(to); } return; }
  var so = e.target.closest('[data-act="signout"]');
  if (so) { e.preventDefault(); signOut(); }
  var uo = e.target.closest('[data-act="uni-off"]');
  if (uo) { e.preventDefault(); setUniversal(false, uo); }
  var rp = e.target.closest('[data-report]');
  if (rp) { e.preventDefault(); openReport(rp.getAttribute('data-report')); }
  var cx = e.target.closest('[data-cancel]');
  if (cx) { e.preventDefault(); openCancel(cx.getAttribute('data-cancel')); }

    var vol = l.vol.indexOf(n) >= 0;
    return '<span class="chip' + (vol ? ' vol' : '') + '"' + (vol ? ' title="Volunteered"' : '') + '>' + h(n) +

  }).join('') + '<button class="add" data-addname="' + h(l.id) + '" aria-label="Add an author to ' + h(lecTitle(l)) + '">+ Add</button></span>';

function wireAuthorEditors(root, onChange) {
  root.addEventListener('click', function (e) {
    var add = e.target.closest('[data-addname]');
    if (add) {
      var id = add.getAttribute('data-addname'), l = byId[id];
      var inp = document.createElement('input');
      inp.className = 'addin'; inp.setAttribute('list', 'names-dl'); inp.setAttribute('aria-label', 'Add an author to ' + lecTitle(l));
      inp.placeholder = 'Name and surname'; inp.autocomplete = 'off';
      add.replaceWith(inp);
      inp.focus();
      var done = false;
      var finish = function (save) {
        if (done) return; done = true;
        var name = inp.value.trim();
        if (!save || !name) { onChange(id); return; }
        inp.disabled = true;
        api('assign', { lectureId: id, name: name }).then(function (r) { updateLecture(r.lecture, r.counts, r.names); onChange(id); toast('Added ' + name + ' to ' + lecTitle(r.lecture) + '.'); },
          function (err) { toast(err.message, true); onChange(id); });
      };
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); finish(true); } if (ev.key === 'Escape') finish(false); });
      inp.addEventListener('blur', function () { finish(true); });
      return;
    }
    var cv = e.target.closest('[data-confirmvol]');
    if (cv) {
      var cid = cv.getAttribute('data-confirmvol'), cn = cv.getAttribute('data-name');
      cv.disabled = true;
      api('confirmVolunteer', { lectureId: cid, name: cn }).then(function (r) { updateLecture(r.lecture, r.counts, r.names); onChange(cid); toast(cn + ' is now assigned to ' + lecTitle(r.lecture) + '.'); },
        function (err) { toast(err.message, true); onChange(cid); });
      return;
    }
    var rm = e.target.closest('[data-unassign]');
    if (rm) {
      var lid = rm.getAttribute('data-unassign'), nm = rm.getAttribute('data-name');
      rm.disabled = true;
      api('unassign', { lectureId: lid, name: nm }).then(function (r) { updateLecture(r.lecture, r.counts, r.names); onChange(lid); toast('Removed ' + nm + ' from ' + lecTitle(r.lecture) + '.'); },
        function (err) { toast(err.message, true); onChange(lid); });
    }
  });
}

// Approved classmates put themselves on a lecture, or take themselves off one they volunteered for

// Dashboard topic field: for signed-in classmates, saves on Enter or when leaving the field
function wireTopicInputs(root, onChange) {
  var save = function (inp) {
    var id = inp.getAttribute('data-topic'), v = inp.value.trim(), l = byId[id];
    if (!l || v === (l.manual || '')) return;
    inp.disabled = true;
    api('setTopic', { lectureId: id, topic: v }).then(function (r) { updateLecture(r.lecture, r.counts); onChange(id); toast(v ? 'Topic saved.' : 'Topic cleared.'); },
      function (err) { inp.disabled = false; toast(err.message, true); });
  };
  root.addEventListener('keydown', function (e) {
    if (e.target.matches && e.target.matches('[data-topic]') && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }

  root.addEventListener('focusout', function (e) { if (e.target.matches && e.target.matches('[data-topic]')) save(e.target); });

function boardHtml(animate) {
  var cw = curWeek(), out = '', phone = !desk();
  for (var k = 0; k < SEM.weeks; k++) {
    if (phone && !D.allWeeks && (k < cw - 1 || k > cw + 1)) continue;
    var days = weekDays(k), n = 0, chips = '';
    S.data.lectures.forEach(function (l) {
      if (l.date < days[0] || l.date > days[4]) return;
      var delay = phone ? 0.15 + n * 0.015 : 0.15 + k * 0.05 + n * 0.012;
      chips += '<button class="cb' + (animate ? ' pop' : '') + ' ' + (l.removed ? 'st-removed' : 'st-' + l.st) + (D.hl === l.id ? ' on' : '') + '" data-jump="' + h(l.id) + '" ' +
        'aria-label="' + h(lecTitle(l) + ', ' + dayLabel_(l.date) + ', ' + statusLabel(l)) + '" style="animation-delay:' + delay.toFixed(3) + 's">' +
        '<span aria-hidden="true" class="cd" style="background:' + ccol(l.cc) + '"></span>' + h(l.abbr + ' ' + l.n) + '</button>';
      n++;
    });
    var mon = new Date(isoMs(days[0]));
    out += '<div class="wrow"><span class="wl"><span class="wlab' + (k === cw ? ' now' : '') + '">Week ' + (k + 1) + '</span><span class="wd">' + mon.getUTCDate() + ' ' + MON_[mon.getUTCMonth()] + '</span></span>' +
      '<span class="wc">' + (chips || '<span class="muted" style="font-size:13px;padding:5px 0">No lectures</span>') + '</span></div>';
  }
  return out;
}

function showPop(btn) {
  var l = byId[btn.getAttribute('data-jump')];
  if (!l) return;
  if (!POP.el) {
    POP.el = document.createElement('div');
    POP.el.className = 'lpop'; POP.el.id = 'lpop'; POP.el.setAttribute('role', 'dialog'); POP.el.hidden = true;
    POP.el.addEventListener('click', function (e) {
      var g = e.target.closest('[data-popgo]');
      if (g) { var id = g.getAttribute('data-popgo'); hidePop(); jump(id); }
    });
    document.body.appendChild(POP.el);
  }
  POP.el.setAttribute('aria-label', lecTitle(l) + ' details');
  POP.el.innerHTML = popHtml(l);
  POP.el.hidden = false; POP.id = l.id;
  POP.el.classList.toggle('hov', !noHover());
  var b = btn.getBoundingClientRect(), vw = document.documentElement.clientWidth, w = POP.el.offsetWidth, hgt = POP.el.offsetHeight;
  var left = Math.min(Math.max(16, b.left), vw - w - 16);
  var top = b.bottom + 8;
  if (top + hgt > window.innerHeight - 8 && b.top - hgt - 8 > 8) top = b.top - hgt - 8;
  POP.el.style.left = (left + window.scrollX) + 'px';
  POP.el.style.top = (top + window.scrollY) + 'px';
}
function hidePop() { if (POP.el) POP.el.hidden = true; POP.id = null; }
function wireBoardPop(board) {
  if (!board) return;
  board.addEventListener('mouseover', function (e) { if (hoverMq.matches || lastPointer === 'touch') return; var b = e.target.closest('[data-jump]'); if (b && POP.id !== b.getAttribute('data-jump')) showPop(b); });
  // off the chip, it goes at once
  board.addEventListener('mouseout', function (e) {
    if (hoverMq.matches || lastPointer === 'touch') return;
    var b = e.target.closest('[data-jump]');
    if (b && !(e.relatedTarget && b.contains(e.relatedTarget))) hidePop();
  });
  // keyboard focus only: a tap also focuses the chip, and the tap itself decides there
  board.addEventListener('focusin', function (e) { var b = e.target.closest('[data-jump]'); var kb = false; try { kb = b && b.matches(':focus-visible'); } catch (x) {} if (kb) showPop(b); });
  board.addEventListener('focusout', function (e) { if (!board.contains(e.relatedTarget) && !(POP.el && POP.el.contains(e.relatedTarget))) hidePop(); });
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hidePop(); });
document.addEventListener('click', function (e) { if (POP.id && !e.target.closest('#lpop') && !e.target.closest('[data-jump]')) hidePop(); });
window.addEventListener('resize', hidePop);

}

function askAccess(t) {

function matches(l) {
  if (D.filter === 'open' && !(l.st === 'open' && !l.removed)) return false;
  if (D.filter === 'overdue' && l.st !== 'overdue') return false;
  if (D.filter === 'writing' && l.st !== 'writing') return false;
  if (D.filter === 'assigned' && l.st !== 'assigned') return false;
  if (D.filter === 'submitted' && !green(l.st)) return false;
  if (D.filter === 'slides' && !l.sl.length) return false;
  var q = D.q.trim().toLowerCase();
  if (!q) return true;
  var hay = [l.module, l.abbr, l.prof, l.topic, l.who.join(' '), l.asg.join(' '), courseInfo_(l.course).name, 'l' + l.n, dayLabel_(l.date)].join(' | ').toLowerCase();
  return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
}

function renderWeekList() {

  var list;
  if (searching) list = S.data.lectures.filter(matches);
  else {
    var days = weekDays(D.week);
    list = S.data.lectures.filter(function (l) { return l.date >= days[0] && l.date <= days[4]; });
    if (phone) list = list.filter(function (l) { return l.date === days[D.day]; });
  }
  var dd = $('#ddays');

function diaryCall(name, req, msg, btn) {

function diaryClick(e) {
  var t = e.target.closest('[data-dtick]');

    var id = t.getAttribute('data-dtick'), s = ((S.diary.ticks[id] || 0) + 1) % 3, l = byId[id];

  var w = e.target.closest('[data-dw]');
  if (w) { var dv = +w.getAttribute('data-dw'); DI.week = dv ? Math.max(0, Math.min(SEM.weeks - 1, DI.week + dv)) : curWeek(); drawDiary(); return; }
  var a = e.target.closest('[data-daim]');

}

var DRIVE = { token: '', exp: 0, client: null };

    restoreGS();

    var sc = document.createElement('script');
    sc.src = 'https://apis.google.com/js/api.js'; sc.async = true;
    sc.onload = function () { window.gapi.load('picker', { callback: function () { restoreGS(); res(window.google.picker); }, onerror: function () { pickerP = null; rej(new Error('Google\'s file picker didn\'t load.')); } }); };

}
function pickFromDrive() {
  return driveToken().then(function (tok) {
    return loadPicker().then(function (gp) {
      return new Promise(function (res) {
        var view = new gp.DocsView(gp.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(false);
        new gp.PickerBuilder().addView(view).addView(new gp.DocsUploadView()).enableFeature(gp.Feature.MULTISELECT_ENABLED)
          .setOAuthToken(tok).setDeveloperKey(GOOGLE_API_KEY).setAppId(GOOGLE_APP_ID).setOrigin(location.protocol + '//' + location.host)
          .setCallback(function (data) {
            if (data.action === gp.Action.PICKED) res((data.docs || []).map(function (x) { return { id: x.id, name: x.name, url: x.url || ('https://drive.google.com/file/d/' + x.id + '/view') }; }));
            if (data.action === gp.Action.CANCEL) res([]);

function driveFetch(url, opt) {

  return fetch(url, opt).then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error('Google Drive said no (' + r.status + '). ' + t.slice(0, 120)); }); return r; });
}
function studyFolder() {
  var q = encodeURIComponent("name = 'IMS Study Tracker' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
  return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)&spaces=drive').then(function (r) { return r.json(); }).then(function (j) {
    if (j.files && j.files[0]) return j.files[0].id;
    return driveFetch('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'IMS Study Tracker', mimeType: 'application/vnd.google-apps.folder' }) })
      .then(function (r) { return r.json(); }).then(function (f) { return f.id; });

}
// Resumable upload in 8 MB pieces, straight from the browser into the person's Drive
function uploadToDrive(file, onProgress) {
  return driveToken().then(studyFolder).then(function (folder) {
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,webViewLink', {
      method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': file.type || 'application/octet-stream', 'X-Upload-Content-Length': String(file.size) },

        onProgress(1);

      });
    };

}

        '<span class="mact" style="flex:0 0 auto"><button class="linkbtn" data-a="approve-other" data-email="' + h(o.email) + '" data-name="' + h(o.name) + '">Approve</button>' + blockBtn(o.email) + '</span></div>';
    }).join('') + '</div>' : '';
  var blocked = '<div class="box" style="margin-top:20px" id="blockedbox"><h3 class="h3" style="margin-bottom:6px">Blocked (' + ac.blocked.length + ')</h3>' +
    '<p style="margin:0 0 12px;font-size:14px;line-height:1.45;color:#5F6368">Blocked addresses can\'t sign in, get codes or ask for access, and they\'re taken off the approved list and the Drive.</p>' +
    '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end"><label class="fld" style="flex:1 1 260px">Block an address<input class="inp" id="blockin" type="email" placeholder="name@example.com" autocomplete="off"></label>' +
    '<button class="sbtn" data-a="blockaddr" style="height:48px;background:#D93025">Block</button></div>' +
    (ac.blocked.length ? '<div style="margin-top:8px">' + ac.blocked.map(function (b) {
      return '<div class="adminli"><span><strong style="font-weight:800;word-break:break-all">' + h(b.email) + '</strong><small>Blocked ' + h(stampIn(b.at)) + (b.by ? ' by ' + h(shortName(b.by)) : '') + '</small></span><button class="linkbtn" data-a="unblock" data-email="' + h(b.email) + '">Unblock</button></div>';
    }).join('') + '</div>' : '<p style="margin:12px 0 0;font-size:15px;color:#5F6368">Nobody is blocked.</p>') + '</div>';
  box.innerHTML = add.replace('style="margin-top:20px"', '') + mem + others + blocked;
  var gb = $('#gatebox'); if (gb) gb.innerHTML = gate.replace('<h3 class="h3" style="margin-bottom:6px">Class password</h3>', '');
  var rb = $('#reqbox2'); if (rb) rb.innerHTML = ac.requests.length ? '<h2 class="h2">Access requests</h2>' + reqs.replace('<h3 class="h3" style="margin-bottom:6px">Access requests</h3>', '') : '';
  renderAllClear();
}

// ----- authors who aren't tied to an account (hand-overs need to know whose a lecture is)
function renderUnmatched() {
  var box = $('#unmatched'), st = S.adminState, list = st.unmatched || [];
  if (!box) return;
  if (!list.length) { box.innerHTML = ''; return; }
  var mem = st.access.members.filter(function (m) { return m.active; });
  var opts = '<option value="">Choose who this is</option>' + mem.map(function (m) { return '<option value="' + h(m.email) + '">' + h(m.name + ' (' + m.email + ')') + '</option>'; }).join('');
  box.innerHTML = '<div class="box" style="margin-bottom:16px"><h3 class="h3" style="margin-bottom:6px">Authors not linked to an account (' + list.length + ')</h3>' +
    '<p style="margin:0 0 6px;font-size:14px;line-height:1.45;color:#5F6368">Hand-overs and swaps need to know whose lecture it is. Names that match an approved classmate exactly are linked automatically; pick the right person for these. Add them as approved classmates first if they aren\'t yet.</p>' +
    list.map(function (u, i) {
      return '<div class="adminli"><span><strong style="font-weight:800">' + h(u.name) + '</strong><small>' + u.lectures + ' ' + pl(u.lectures, 'lecture', 'lectures') + ' still to write</small></span>' +
        '<span style="display:flex;gap:8px;flex:1 1 320px;max-width:460px"><select class="inp" id="ul-' + i + '" style="height:40px" aria-label="Who ' + h(u.name) + ' is">' + opts + '</select><button class="sbtn" data-a="linkauthor" data-i="' + i + '" style="height:40px">Link</button></span></div>';
    }).join('') + '</div>';
}

// ----- reports
function rmBtn(id) {
  if (A.confirmRm === id) return '<span style="display:inline-flex;gap:8px;align-items:center"><button class="sbtn" data-a="rmup" data-id="' + h(id) + '" style="height:32px;padding:0 12px;font-size:13px;background:#D93025">Take it down</button><button class="linkbtn" data-a="rmcancel2">Cancel</button></span>';
  return '<button class="linkbtn" data-a="rmup" data-id="' + h(id) + '" style="color:#B3261E">Take down</button>';
}
function renderReports() {
  var box = $('#repbox'), list = S.adminState.reports;
  if (!box) return;
  var wrap = $('#repwrap');
  if (wrap) wrap.hidden = !list.length;
  renderAllClear();
  if (!list.length) { box.innerHTML = ''; return; }
  box.innerHTML = list.map(function (r) {
    var subs = r.subs.map(function (x) {
      return '<div class="adminli"><span><strong style="font-weight:800">' + (x.kind === 'slides' ? 'Slides' : 'Sbobina') + (x.part > 1 ? ', part ' + x.part : '') + '</strong><small style="word-break:break-all">Uploaded ' + h(stampLabel(x.at)) + (x.by ? ' by ' + h(x.by) : '') + '</small></span>' +
        '<span class="mact" style="flex:0 0 auto">' + (x.url ? '<a href="' + h(x.url) + '" target="_blank" rel="noopener" style="font-weight:700">Open</a>' : '') + rmBtn(x.id) + '</span></div>';
    }).join('');
    return '<div class="loud" style="margin-bottom:16px"><h3>' + h(r.title) + ' <span style="font-size:15px;font-weight:600;color:#5F6368">' + h(r.day) + '</span></h3>' +
      '<p>Flagged: <strong style="font-weight:800">' + h(REPWHAT[r.what] || r.what) + '</strong>, ' + h(stampIn(r.at)) + ', by ' + h(r.by) + '</p>' +
      (r.note ? '<p style="background:#F3F4F2;border-radius:12px;padding:10px 12px;margin-top:10px">' + h(r.note) + '</p>' : '') +
      '<p style="margin-top:10px">Topic now: ' + (r.topic ? '<strong style="font-weight:800">' + h(r.topic) + '</strong>' : 'none') +
      (r.manual && r.manual === r.topic ? ' <button class="linkbtn" data-a="rep-cleartopic" data-id="' + h(r.lectureId) + '" data-row="' + r.row + '" style="font-size:14px;color:#B3261E">Clear this topic</button>' : '') + '</p>' +
      (subs ? '<div style="margin-top:10px">' + subs + '</div>' : '') +
      '<div class="actrow"><button class="sbtn" data-a="rep-done" data-row="' + r.row + '">Mark as handled</button><button class="sbtn2 soft" data-a="rep-dismiss" data-row="' + r.row + '">Dismiss</button></div></div>';
  }).join('');
}

// ----- admins and settings
function renderAdmins() {
  var st = S.adminState, me = st.me, s = st.settings, box = $('#adminbox');
  if (!box) return;
  box.innerHTML = '<div class="box"><ul style="list-style:none;margin:0;padding:0">' +
    st.admins.map(function (a) {
      var mine = a.email.toLowerCase() === me.email.toLowerCase();
      var act = mine ? '<button class="linkbtn" data-a="newkey" style="font-size:14px">Make an emergency key</button>'
        : A.removing === a.email ? '<span style="display:flex;gap:10px;align-items:center;font-size:14px"><button class="sbtn" data-a="rmadmin" data-email="' + h(a.email) + '" style="height:36px;background:#D93025">Remove</button><button class="linkbtn" data-a="rmcancel">Cancel</button></span>'
          : '<button class="linkbtn" data-a="rmadmin" data-email="' + h(a.email) + '" style="font-size:14px">Remove</button>';
      return '<li class="adminli"><span><strong style="font-weight:800">' + h(a.name) + '</strong>' + (mine ? ' <span style="color:#5F6368">(you)</span>' : '') + '<small>' + (a.addedBy === 'setup' ? 'Added at setup' : 'Added by ' + h(shortName(a.addedBy)) + (a.addedAt ? ', ' + h(stampLabel(a.addedAt)) : '')) + ' · ' + h(a.email) + '</small></span>' + act + '</li>';
    }).join('') + '</ul>' +
    (A.newKey ? '<div class="graybox drop">Your emergency key, also emailed to you. If signing in ever fails, use it under "Admin key" on the sign-in page.<div class="keyshow">' + h(A.newKey) + '</div></div>' : '') +
    '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:12px;padding-top:16px;border-top:1px solid #E8EAED">' +
    '<label class="fld" style="flex:1 1 150px">Name<input class="inp" id="nan" placeholder="e.g. Marco Tosi"></label>' +
    '<label class="fld" style="flex:2 1 200px">Email<input class="inp" id="nae" type="email" placeholder="The address they sign in with"></label>' +
    '<button class="sbtn" data-a="addadmin" style="height:48px">Add admin</button></div></div>';
  var sb = $('#setbox');
  if (sb) sb.innerHTML = '<div class="box">' +
    '<label class="fld">Days after a lecture before it counts as overdue<span style="display:flex;gap:10px"><input class="inp" id="grace" value="' + h(s.grace) + '" inputmode="numeric" style="width:100px;font-weight:700"><button class="sbtn2 soft" data-a="savegrace">Save</button></span></label>' +
    '<ul class="alinks"><li><a href="' + h(s.dataSheetUrl) + '" target="_blank" rel="noopener">Open the data sheet' + (S.env === 'test' ? ' (test)' : '') + '</a></li>' +
    '<li><button class="linkbtn" data-a="copyurl" style="font-size:15px">Copy the portal link</button></li>' +
    '<li><a href="' + h(pageHref('dashboard', 'live')) + '">Open the dashboard</a></li></ul></div>';
}

// ----- test mode
function renderTest() {
  var s = S.adminState.settings, box = $('#testbox');
  if (!box) return;
  var inTest = S.env === 'test';
  var uni = s.universal || { on: false };
  var uniBox = '<div class="box" style="margin-top:20px"><div class="swrow" style="align-items:flex-start"><span style="display:block"><b style="display:block;font-size:19px;font-weight:900">Universal test mode</b>' +
    '<span style="display:block;font-size:15px;font-weight:500;line-height:1.5;color:#3C4043;margin-top:6px;max-width:720px">' + (uni.on
      ? '<strong style="color:#B3261E">On</strong> since ' + h(stampIn(uni.at)) + (uni.by ? ', by ' + h(shortName(uni.by)) : '') + '. Everyone who opens the portal without an admin key sees the test portal and can try every step. Admins still see the real one.'
      : 'Off. Turn it on to let the whole class try the portal: everyone who opens it without an admin key gets the test portal (test data, test folders, test email list) until an admin turns it off. Your own test mode above keeps working either way.') + '</span></span>' +
    '<button class="sw" role="switch" aria-label="Universal test mode" aria-checked="' + uni.on + '" data-a="uni"><span class="knob"></span></button></div>' +
    (A.confirmUni ? '<div class="graybox drop" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><span style="flex:1 1 260px">Turn it on? Classmates who open the portal will see test data instead of the real semester until someone turns it off.</span><button class="sbtn" data-a="uni-yes">Yes, turn it on</button><button class="linkbtn" data-a="uni-cancel">Cancel</button></div>' : '') + '</div>';
  box.innerHTML = '<div class="stripe"><p>Try anything without touching the real portal. In test mode, uploads go to the test folders, emails go only to the test list, and author changes and schedule approvals only change the test copy of the data. The real dashboard never sees any of it.</p>' +
    '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px">' +
    (inTest ? '<a class="wbtn" href="' + h(pageHref('admin', 'live')) + '">Leave test mode</a>' : '<a class="wbtn" href="' + h(pageHref('dashboard', 'test')) + '">Open the site in test mode</a>') +
    (A.confirmReset ? '<button class="wbtn2 danger" data-a="reset">Yes, reset the test data</button><button class="wbtn2" data-a="resetcancel">Cancel</button>' : '<button class="wbtn2" data-a="reset">Reset test data</button>') +
    '</div>' +
    (A.confirmReset ? '<p class="drop" style="margin-top:12px;font-size:14px">This recopies the live lectures, clears test submissions and author assignments, and trashes every file in the test folders.' +
      (s.universal && s.universal.on ? ' <strong>Universal test mode is on, so this also wipes whatever classmates are trying right now.</strong>' : '') + '</p>' : '') +
    '</div>' +
    '<div class="two" style="margin-top:20px"><div class="box" style="flex:1 1 380px"><h3 class="h3" style="margin-bottom:6px">Test folders</h3>' +
    '<p style="margin:0 0 12px;font-size:15px;line-height:1.5;color:#3C4043">Made at setup, laid out like the real ones: 3 sbobine folders and 3 slides folders.</p>' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F3F4F2;border-radius:14px;padding:12px 14px"><strong style="font-weight:800">' + h(s.testRoot ? s.testRoot.name : 'Not created yet (run setup)') + '</strong>' + (s.testRoot ? '<a href="' + h(s.testRoot.url) + '" target="_blank" rel="noopener" style="font-weight:700">Open</a>' : '') + '</div>' +
    (s.testDataUrl ? '<p style="margin:12px 0 0;font-size:14px"><a href="' + h(s.testDataUrl) + '" target="_blank" rel="noopener" style="font-weight:700">Open the test data sheet</a></p>' : '') + '</div>' +
    '<div class="box" style="flex:1 1 380px"><h3 class="h3" style="margin-bottom:6px">Test email list</h3>' +
    '<p style="margin:0 0 12px;font-size:15px;line-height:1.5;color:#3C4043">Test emails go only here, in their own thread, with [TEST] in front of the subject.</p>' +
    '<div style="margin:0 0 12px"><button class="sbtn2" data-a="testemail-test">Send a test email to this list</button></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:8px">' + s.testEmails.map(function (e) { return '<span class="chip" style="height:36px;font-size:14px;padding:0 2px 0 12px">' + h(e) + '<button class="chipx" data-a="rmtestmail" data-email="' + h(e) + '" aria-label="Remove ' + h(e) + '">×</button></span>'; }).join('') +
    '<button class="add" data-a="addtestmail" style="height:36px;font-size:14px">+ Add an email</button></div></div></div>' + uniBox;
}

// ----- activity
function lecName(id) {
  var l = byId[id];
  return l ? lecTitle(l) : id ? dayLabel_(id.slice(0, 10)) + ' ' + id.slice(11) : '';
}
function activityText(r) {
  var j = function (s) { try { return JSON.parse(s); } catch (e) { return s; } };
  var b = j(r.before), a = j(r.after);
  var diffNames = function (x, y) { x = Array.isArray(x) ? x : []; y = Array.isArray(y) ? y : []; return y.filter(function (n) { return x.indexOf(n) < 0; }); };
  if (r.action === 'assign') return 'Added ' + diffNames(b, a).join(', ') + ' to ' + lecName(r.lectureId);
  if (r.action === 'unassign') return 'Removed ' + diffNames(a, b).join(', ') + ' from ' + lecName(r.lectureId);
  if (r.action === 'import') return 'Imported authors for ' + lecName(r.lectureId) + ': ' + (Array.isArray(a) ? a.join(', ') : '');
  if (r.action === 'approve-schedule') return 'Approved a schedule change' + (a && a.counts ? ' (' + a.counts.changed + ' changed, ' + a.counts.added + ' added, ' + a.counts.removed + ' removed)' : '');
  if (r.action === 'dismiss-schedule') return 'Dismissed a schedule change';
  if (r.action === 'upload' && a) return (a.kind === 'slides' ? 'Uploaded slides' : 'Uploaded the sbobina') + ' for ' + a.title + (a.part > 1 ? ', part ' + a.part : '') + (a.kind === 'sbobina' && a.by ? ' (authors: ' + a.by + ')' : '') + (a.state === 'superseded' ? ' (since replaced)' : a.state === 'removed' ? ' (taken down)' : '') + (a.email === 'imported' ? ' (imported)' : '');
  if (r.action === 'topic') return (a ? (b ? 'Changed the topic of ' : 'Added the topic of ') + lecName(r.lectureId) + ': "' + a + '"' : 'Cleared the topic of ' + lecName(r.lectureId));
  if (r.action === 'filtered' && a) return 'Blocked wording (' + a.field + '): "' + a.text + '"';
  if (r.action === 'volunteer') return 'Volunteered for ' + lecName(r.lectureId);
  if (r.action === 'withdraw') return 'Withdrew from ' + lecName(r.lectureId);
  if (r.action === 'confirm-volunteer') return 'Made ' + a + ' an assigned author of ' + lecName(r.lectureId);
  if (r.action === 'request') return 'Asked for access';
  var other = a && a.otherId ? lecName(a.otherId) : '';
  if (r.action === 'hand-request' && a) return a.kind === 'swap' ? 'Asked ' + a.to + ' to swap ' + lecName(r.lectureId) + ' for ' + other : 'Asked ' + a.to + ' to take over ' + lecName(r.lectureId);
  if (r.action === 'handover' && a) return a.to + ' took over ' + lecName(r.lectureId) + ' from ' + a.from;
  if (r.action === 'swap' && a) return a.from + ' and ' + a.to + ' swapped ' + lecName(r.lectureId) + ' and ' + other;
  if (r.action === 'hand-declined' && a) return 'Declined ' + a.from + '\'s request for ' + lecName(r.lectureId);
  if (r.action === 'hand-cancelled' && a) return 'Cancelled the request to ' + a.to + ' for ' + lecName(r.lectureId);
  if (r.action === 'hand-undone' && a) return 'Undid the ' + (a.kind === 'swap' ? 'swap' : 'hand-over') + ' of ' + lecName(r.lectureId) + ' between ' + a.from + ' and ' + a.to;
  if (r.action === 'link-author' && a) return 'Linked the author name ' + a.name + (a.email ? ' to ' + a.email : '');
  if (r.action === 'remove-upload' && a) return 'Took down ' + (a.kind === 'slides' ? 'slides' : 'the sbobina') + ' for ' + a.title + (a.restored ? ', the earlier version is back' : '');
  if (r.action === 'report-resolved') return 'Handled a report on ' + lecName(r.lectureId);
  if (r.action === 'report-dismissed') return 'Dismissed a report on ' + lecName(r.lectureId);
  if (r.action === 'members' && a && typeof a === 'object') {
    if (a.declined) return 'Declined access for ' + a.declined;
    if (a.deactivated) return 'Deactivated ' + a.deactivated;
    if (a.reactivated && typeof a.reactivated === 'string') return 'Reactivated ' + a.reactivated;
    if (a.blocked) return 'Blocked ' + a.blocked;
    if (a.unblocked) return 'Unblocked ' + a.unblocked;
    if (a.removed) return 'Removed ' + a.removed + ' from the approved list';
    return (a.source === 'request' ? 'Approved an access request' : 'Added ' + a.added + ' ' + pl(a.added, 'person', 'people')) + (a.reactivated ? ', reactivated ' + a.reactivated : '');
  }
  if (r.action === 'settings' && a && typeof a === 'object') {
    var k = Object.keys(a)[0], val = a[k];
    var names = { link: 'Changed the schedule link', graceDays: 'Set the overdue grace period to ' + val + ' days', groupEmail: 'Set the group address to ' + val, testEmails: 'Changed the test email list',
      root: 'Changed the Drive folders', folders: 'Changed the Drive folders', syncedAccess: 'Synced Drive access (' + val + ' people)', addedAdmin: 'Added admin ' + val, removedAdmin: 'Removed admin ' + val,
      newKey: 'Made an emergency admin key', resetTest: 'Reset the test data', universalTest: (val ? 'Turned universal test mode on' : 'Turned universal test mode off'), classPassword: 'Set the class password' };
    return names[k] || 'Changed settings';
  }
  return r.action;
}
function renderActivity() {
  var box = $('#actbox'), list = S.adminState.activity;
  if (!box) return;
  var all = list.length, shown = A.allActivity ? list : list.slice(0, 25);
  var admins = {};
  S.adminState.admins.forEach(function (x) { admins[x.email.toLowerCase()] = 1; });
  box.innerHTML = all ? shown.map(function (r, i) {
    var hid = (r.action === 'handover' || r.action === 'swap') ? (function () { try { return JSON.parse(r.after).id; } catch (x) { return ''; } })() : '';
    var acts = (r.action === 'upload' && r.state === 'current' && r.id ? rmBtn(r.id) : '') + (hid ? '<button class="linkbtn" data-a="undohand" data-id="' + h(hid) + '">Undo</button>' : '') + (r.email && !admins[r.email] ? blockBtn(r.email) : '');
    return '<div class="actv" style="' + (i === 0 ? 'border-top:0' : '') + '"><span style="color:#5F6368">' + h(stampLabel(r.at)) + '</span><strong style="font-weight:800">' + h(r.who === 'Portal' || r.who === 'Import' ? r.who : shortName(r.who)) + '</strong>' +
      '<span>' + h(activityText(r)) + (r.email ? '<span class="meta" style="word-break:break-all">' + h(r.email) + '</span>' : '') + (acts ? '<span class="mact" style="margin-top:6px">' + acts + '</span>' : '') + '</span></div>';
  }).join('') + (all > shown.length ? '<div style="padding:12px 0 16px;border-top:1px solid #E8EAED"><button class="pillbtn" data-a="allact">Show all ' + all + '</button></div>' : '') : '<p style="padding:16px 0;color:#5F6368">Nothing yet.</p>';
}

// =====================================================================================
// Start
// =====================================================================================
(function start() {
  S.tok = store.get('st.tok') || ''; S.pt = store.get('st.pt') || ''; S.key = store.get('sb.key') || '';
  try { S.viewAs = +(window.sessionStorage.getItem('st.viewas') || 0) || 0; } catch (e) {}
  if (BOOT.error) { $('#view').innerHTML = '<div class="wrap"><div class="err-box">' + h(BOOT.error) + '</div></div>'; renderHeader(); return; }
  renderPage();
})();
})();
</script>
